<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS. Balls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        .stats-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border-left: 4px solid;
            min-width: 140px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        #stats-panel::-webkit-scrollbar {
            height: 4px;
        }
        #stats-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        #flashbang {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
        .menu-hidden {
            display: none !important;
        }
        .spawn-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .spawn-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="flashbang"></div>

    <!-- Main Control Bar -->
    <div class="fixed top-4 left-4 z-50 flex flex-col gap-2">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold lowercase text-slate-500">vs. balls</h1>
            <button id="spawn-toggle-btn" onclick="toggleMenu()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold shadow-lg transition lowercase">
                spawn
            </button>
            <button onclick="clearArena()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs transition shadow-lg lowercase">
                clear
            </button>
        </div>
        
        <!-- Collapsible Spawn Menu -->
        <div id="spawn-menu" class="menu-hidden bg-slate-900/95 backdrop-blur-md p-3 rounded-xl border border-slate-700 shadow-2xl flex flex-col gap-3 w-48">
            <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-2">
                <label class="text-[10px] lowercase text-slate-400 font-bold">hp:</label>
                <input type="number" id="default-hp" value="100" class="w-16 bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 outline-none text-blue-400 text-right text-xs">
            </div>

            <div class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1 spawn-scroll">
                <button onclick="spawnBall('sword')" class="px-2 py-2 bg-blue-600/20 border border-blue-500/30 hover:bg-blue-500/40 rounded text-[10px] transition lowercase">sword</button>
                <button onclick="spawnBall('laser')" class="px-2 py-2 bg-red-600/20 border border-red-500/30 hover:bg-red-500/40 rounded text-[10px] transition lowercase">laser</button>
                <button onclick="spawnBall('unarmed')" class="px-2 py-2 bg-green-600/20 border border-green-500/30 hover:bg-green-500/40 rounded text-[10px] transition lowercase">unarmed</button>
                <button onclick="spawnBall('dark magician')" class="px-2 py-2 bg-purple-600/20 border border-purple-500/30 hover:bg-purple-500/40 rounded text-[10px] transition lowercase">mage</button>
                <button onclick="spawnBall('randomizer')" class="px-2 py-2 bg-cyan-600/20 border border-cyan-500/30 hover:bg-cyan-500/40 rounded text-[10px] transition lowercase">random</button>
                <button onclick="spawnBall('dagger')" class="px-2 py-2 bg-yellow-600/20 border border-yellow-500/30 hover:bg-yellow-500/40 rounded text-[10px] transition lowercase">dagger</button>
                <button onclick="spawnBall('heartstealer')" class="px-2 py-2 bg-pink-500/20 border border-pink-500/30 hover:bg-pink-500/40 rounded text-[10px] transition lowercase">heart</button>
                <button onclick="spawnBall('eggthrower')" class="px-2 py-2 bg-yellow-100/20 border border-yellow-200/30 hover:bg-yellow-100/40 rounded text-[10px] transition lowercase text-yellow-200">egg</button>
                <button onclick="spawnBall('black hole')" class="px-2 py-2 bg-indigo-950/40 border border-indigo-400/30 hover:bg-indigo-900/60 rounded text-[10px] transition lowercase">void</button>
                <button onclick="spawnBall('zen')" class="px-2 py-2 bg-zinc-900/40 border border-zinc-700 hover:bg-zinc-800 rounded text-[10px] transition lowercase">zen</button>
                <button onclick="spawnBall('slammer')" class="px-2 py-2 bg-orange-600/20 border border-orange-500/30 hover:bg-orange-500/40 rounded text-[10px] transition lowercase">slam</button>
                <button onclick="spawnBall('nuke')" class="px-2 py-2 bg-white text-black hover:bg-slate-200 rounded text-[10px] font-bold transition lowercase">nuke</button>
            </div>
        </div>
    </div>

    <!-- Stats Panel -->
    <div id="stats-panel" class="fixed bottom-0 left-0 right-0 z-50 flex gap-2 p-4 overflow-x-auto whitespace-nowrap bg-slate-900/80 backdrop-blur-md border-t border-slate-700 pointer-events-auto min-h-[100px]">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statsPanel = document.getElementById('stats-panel');
        const flashbang = document.getElementById('flashbang');
        const hpInput = document.getElementById('default-hp');
        const spawnMenu = document.getElementById('spawn-menu');

        let width, height;
        let balls = [];
        let particles = [];
        let lasers = [];
        let pools = []; // For yolk pools
        
        const BASE_DRAG = 0.999; 
        const BOUNCE = 1.0; 
        const COLLISION_BOOST = 1.05; 
        const BALL_RADIUS = 22;
        const STATS_HEIGHT = 100;

        const MIN_SPEED = 2;
        const MAX_SPEED = 30;

        const TYPES = ['sword', 'laser', 'unarmed', 'dark magician', 'dagger', 'heartstealer', 'slammer', 'eggthrower'];

        function toggleMenu() {
            const isHidden = spawnMenu.classList.contains('menu-hidden');
            const btn = document.getElementById('spawn-toggle-btn');
            if (isHidden) {
                spawnMenu.classList.remove('menu-hidden');
                btn.style.backgroundColor = '#475569';
            } else {
                spawnMenu.classList.add('menu-hidden');
                btn.style.backgroundColor = '#2563eb';
            }
        }

        class Ball {
            constructor(x, y, type, isClone = false, cloneHp = 100, lifeSpan = -1, creatorId = null) {
                this.id = Math.random().toString(36).substr(2, 5);
                this.creatorId = creatorId;
                this.x = x;
                this.y = y;
                
                const speedScale = (type === 'black hole') ? 0.5 : 10;
                this.vx = (Math.random() - 0.5) * speedScale;
                this.vy = (Math.random() - 0.5) * speedScale;
                
                this.type = type;
                this.isClone = isClone; 
                this.radius = BALL_RADIUS;
                this.lifeSpan = lifeSpan; 
                
                const startHp = isClone ? cloneHp : parseInt(hpInput.value) || 100;
                this.hp = startHp;
                this.maxHp = startHp;
                
                this.color = this.getColor();
                this.hitCooldown = 0;
                this.stunTimer = 0;
                
                this.setupType();
            }

            getColor() {
                switch(this.type) {
                    case 'sword': return '#3b82f6';
                    case 'laser': return '#ef4444';
                    case 'unarmed': return '#22c55e';
                    case 'dark magician': return '#a855f7';
                    case 'dagger': return '#eab308';
                    case 'heartstealer': return '#ec4899';
                    case 'eggthrower': return '#fef3c7';
                    case 'black hole': return '#000000';
                    case 'zen': return '#000000';
                    case 'slammer': return '#ea580c';
                    case 'nuke': return '#ffffff';
                    case 'randomizer': return '#06b6d4';
                    default: return '#ffffff';
                }
            }

            setupType() {
                switch(this.type) {
                    case 'sword': this.swordDmg = 5; this.swordAngle = 0; break;
                    case 'laser': this.laserTimer = 0; this.laserCooldown = 1000; break;
                    case 'unarmed': this.unarmedMaxSpeed = 8; break;
                    case 'dark magician': this.bookAngle = 0; this.nextCloneHp = 10; break;
                    case 'dagger': this.swingSpeed = 1.5; this.swingAngle = 0; this.daggerDmg = 1; break;
                    case 'heartstealer': this.wandDmg = 1; this.wandAngle = 0; break;
                    case 'eggthrower': 
                        this.eggAngle = 0; 
                        this.eggDmg = 3; 
                        this.isEggThrown = false; 
                        this.eggReturnTimer = 0;
                        this.eggCooldown = 0; // New cooldown timer
                        this.eggX = 0;
                        this.eggY = 0;
                        this.totalDamageAdded = 0;
                        break;
                    case 'black hole': this.fixedSpeed = 0.4; break;
                    case 'slammer': this.slamHits = 0; this.slamTimer = 0; this.isSlamming = false; break;
                    case 'nuke': this.nukeTimer = 20; this.isCharging = false; this.chargeTimer = 2.5; break;
                    case 'randomizer': 
                        this.spawnTimer = 2.5; 
                        this.baseSpawnTime = 2.5;
                        break;
                }
            }

            update() {
                if (this.stunTimer > 0) {
                    this.stunTimer -= 0.0166;
                    this.vx *= 0.9;
                    this.vy *= 0.9;
                }

                if (this.lifeSpan > 0) {
                    this.lifeSpan -= 0.0166;
                    if (this.lifeSpan <= 0) this.hp = 0;
                }

                if (this.type === 'black hole') {
                    const angle = Math.atan2(this.vy, this.vx);
                    this.vx = Math.cos(angle) * this.fixedSpeed;
                    this.vy = Math.sin(angle) * this.fixedSpeed;
                    
                    balls.forEach(other => {
                        if (other === this) return;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const dist = Math.hypot(dx, dy);
                        const horizon = 250;
                        if (dist < horizon && dist > 1) {
                            const normalized = (horizon - dist) / horizon;
                            const force = Math.pow(normalized, 3) * 1.5; 
                            other.vx += (dx / dist) * force;
                            other.vy += (dy / dist) * force;
                        }
                    });
                } else {
                    let speed = Math.hypot(this.vx, this.vy);
                    const dragFactor = BASE_DRAG - (Math.pow(speed / MAX_SPEED, 2) * 0.05);
                    this.vx *= dragFactor;
                    this.vy *= dragFactor;
                }
                
                this.x += this.vx;
                this.y += this.vy;

                if (this.type !== 'black hole') {
                    let speed = Math.hypot(this.vx, this.vy);
                    if (speed > MAX_SPEED) {
                        this.vx = (this.vx / speed) * MAX_SPEED;
                        this.vy = (this.vy / speed) * MAX_SPEED;
                    } else if (speed < MIN_SPEED && speed > 0) {
                        this.vx = (this.vx / speed) * MIN_SPEED;
                        this.vy = (this.vy / speed) * MIN_SPEED;
                    }
                }

                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -BOUNCE; }
                if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -BOUNCE; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -BOUNCE; }
                
                const playHeight = height - STATS_HEIGHT;
                if (this.y + this.radius > playHeight) {
                    this.y = playHeight - this.radius;
                    this.vy *= -BOUNCE;
                }

                // Check pools
                pools.forEach(pool => {
                    if (Math.hypot(this.x - pool.x, this.y - pool.y) < this.radius + pool.r) {
                        this.stunTimer = 0.5;
                    }
                });

                // Unique logic
                if (this.type === 'sword') this.swordAngle += 0.1;
                if (this.type === 'dagger') this.swingAngle += 0.1 * this.swingSpeed;
                if (this.type === 'heartstealer') this.wandAngle += 0.12;
                if (this.type === 'dark magician') this.bookAngle += 0.05;
                if (this.type === 'eggthrower') {
                    if (this.eggCooldown > 0) this.eggCooldown -= 0.0166;

                    if (!this.isEggThrown) {
                        this.eggAngle += 0.15;
                        this.eggX = this.x + Math.cos(this.eggAngle) * 40;
                        this.eggY = this.y + Math.sin(this.eggAngle) * 40;
                        
                        // Look for targets if cooldown is up
                        if (this.eggCooldown <= 0) {
                            let target = null;
                            let minDist = 300;
                            balls.forEach(b => {
                                if (b === this || b.creatorId === this.id) return;
                                let d = Math.hypot(this.x - b.x, this.y - b.y);
                                if (d < minDist) { minDist = d; target = b; }
                            });
                            if (target) {
                                this.isEggThrown = true;
                                this.eggCooldown = 1.5; // Nerf: 1.5s cooldown
                                
                                // Accuracy nerf (65% accuracy)
                                let accuracyOffset = (Math.random() > 0.65) ? (Math.random() - 0.5) * 1.5 : 0;
                                let angleToTarget = Math.atan2(target.y - this.eggY, target.x - this.eggX) + accuracyOffset;
                                let throwSpeed = 10;
                                
                                this.eggVX = Math.cos(angleToTarget) * throwSpeed;
                                this.eggVY = Math.sin(angleToTarget) * throwSpeed;
                            }
                        }
                    } else {
                        this.eggX += this.eggVX;
                        this.eggY += this.eggVY;
                        this.eggReturnTimer++;

                        // Check egg hit
                        balls.forEach(b => {
                            if (b === this || b.id === this.creatorId) return;
                            if (Math.hypot(this.eggX - b.x, this.eggY - b.y) < b.radius + 8) {
                                b.takeDamage(this.eggDmg, this);
                                this.totalDamageAdded += 3;
                                pools.push({ x: this.eggX, y: this.eggY, r: 40, life: 5 });
                                this.resetEgg();
                            }
                        });

                        if (this.eggReturnTimer > 60 || this.eggX < 0 || this.eggX > width || this.eggY < 0 || this.eggY > height - STATS_HEIGHT) {
                            this.resetEgg();
                        }
                    }
                }
                if (this.type === 'laser') {
                    this.laserTimer += 16.6; 
                    if (this.laserTimer >= this.laserCooldown) { this.shootLaser(); this.laserTimer = 0; }
                }
                if (this.type === 'randomizer') {
                    this.spawnTimer -= 0.0166;
                    if (this.spawnTimer <= 0) {
                        this.spawnTimer = this.baseSpawnTime;
                        const randomType = TYPES[Math.floor(Math.random() * TYPES.length)];
                        balls.push(new Ball(this.x, this.y, randomType, true, 50, 5, this.id));
                    }
                }
                if (this.type === 'nuke') {
                    if (!this.isCharging) {
                        this.nukeTimer -= 0.0166;
                        if (this.nukeTimer <= 0) this.isCharging = true;
                    } else {
                        this.chargeTimer -= 0.0166;
                        if (this.chargeTimer <= 0) triggerGlobalNuke(this);
                    }
                }

                if (this.hitCooldown > 0) this.hitCooldown--;
            }

            resetEgg() {
                this.isEggThrown = false;
                this.eggReturnTimer = 0;
            }

            shootLaser() {
                let nearest = null; let minDist = Infinity;
                balls.forEach(b => {
                    if (b === this || b.id === this.creatorId || b.creatorId === this.id) return;
                    const d = Math.hypot(this.x - b.x, this.y - b.y);
                    if (d < minDist) { minDist = d; nearest = b; }
                });
                if (nearest) {
                    lasers.push({ x1: this.x, y1: this.y, x2: nearest.x, y2: nearest.y, life: 10 });
                    nearest.takeDamage(3, this);
                }
            }

            takeDamage(dmg, owner) {
                if (this.type === 'zen') return; 
                if (owner && (owner.id === this.creatorId || owner.creatorId === this.id)) return;

                this.hp -= dmg;
                createParticles(this.x, this.y, this.color);
                
                if (owner) {
                    if (owner.type === 'sword') owner.swordDmg += 1;
                    if (owner.type === 'laser') owner.laserCooldown = Math.max(50, owner.laserCooldown - 20);
                    if (owner.type === 'dagger') owner.swingSpeed += 0.1;
                    if (owner.type === 'dark magician') owner.nextCloneHp += 1;
                    if (owner.type === 'heartstealer') { owner.wandDmg += 0.5; owner.hp += Math.min(dmg, 20); }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'black hole') {
                    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 45);
                    grad.addColorStop(0, 'rgba(79, 70, 229, 0.7)');
                    grad.addColorStop(0.4, 'rgba(0, 0, 0, 1)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.strokeStyle = this.isClone || this.lifeSpan > 0 ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.8)';
                ctx.lineWidth = this.isClone ? 1 : 3;
                if(this.type === 'black hole') ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = (this.type === 'nuke' || this.type === 'randomizer' || this.type === 'eggthrower') ? 'black' : 'white';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let label = Math.ceil(this.hp);
                if (this.type === 'nuke') label = this.isCharging ? "!!!" : Math.ceil(this.nukeTimer);
                if (this.type === 'randomizer') label = "?";
                if (this.type === 'black hole') label = "●";
                if (this.type === 'eggthrower') label = "🍳";
                ctx.fillText(label, 0, 0);

                if (this.type === 'randomizer') {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(0,0, this.radius + 3, 0, (this.spawnTimer/this.baseSpawnTime) * Math.PI * 2); ctx.stroke();
                }
                if (this.type === 'sword') {
                    ctx.rotate(this.swordAngle);
                    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(25, -4, 25, 8);
                }
                if (this.type === 'dark magician') {
                    ctx.rotate(this.bookAngle);
                    ctx.fillStyle = '#fef3c7'; ctx.fillRect(25, -8, 16, 16);
                    ctx.fillStyle = '#7e22ce'; ctx.fillRect(26, -6, 2, 12); 
                }
                if (this.type === 'heartstealer') {
                    ctx.rotate(this.wandAngle);
                    ctx.fillStyle = '#f9a8d4'; ctx.fillRect(25, -2, 18, 4);
                    ctx.beginPath(); ctx.arc(43, 0, 5, 0, Math.PI*2); ctx.fillStyle = '#db2777'; ctx.fill();
                }
                if (this.type === 'dagger') {
                    ctx.rotate(this.swingAngle);
                    ctx.fillStyle = '#fde047'; ctx.fillRect(20, -2, 15, 4);
                }
                ctx.restore();

                // Draw egg separately if exists
                if (this.type === 'eggthrower') {
                    ctx.save();
                    ctx.translate(this.eggX, this.eggY);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 10, 0, 0, Math.PI*2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.stroke();
                    ctx.restore();
                }
            }

            getPrimaryStat() {
                switch(this.type) {
                    case 'sword': return { label: 'dmg', val: this.swordDmg || 5 };
                    case 'laser': return { label: 'rate', val: (1000/this.laserCooldown).toFixed(1) + '/s' };
                    case 'unarmed': return { label: 'spd', val: Math.round(Math.hypot(this.vx, this.vy)) };
                    case 'dark magician': return { label: 'next', val: this.nextCloneHp };
                    case 'dagger': return { label: 'swng', val: (this.swingSpeed || 1.5).toFixed(1) };
                    case 'heartstealer': return { label: 'pwr', val: (this.wandDmg || 1).toFixed(1) };
                    case 'eggthrower': return { label: 'bonus', val: '+' + this.totalDamageAdded };
                    case 'randomizer': return { label: 'rate', val: this.baseSpawnTime.toFixed(2) + 's' };
                    case 'nuke': return { label: 'time', val: Math.ceil(this.nukeTimer) + 's' };
                    case 'black hole': return { label: 'pull', val: '∞' };
                    default: return { label: 'spd', val: Math.round(Math.hypot(this.vx, this.vy)) };
                }
            }
        }

        function triggerGlobalNuke(source) {
            flashbang.style.transition = "none";
            flashbang.style.opacity = "1";
            setTimeout(() => { flashbang.style.transition = "opacity 3.5s ease-out"; flashbang.style.opacity = "0"; }, 50);
            const currentBalls = [...balls];
            currentBalls.forEach(b => b.takeDamage(b.maxHp * 10, source));
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 4; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color });
            }
        }

        function spawnBall(type) {
            const x = Math.random() * (width - 100) + 50;
            const y = Math.random() * (height - STATS_HEIGHT - 100) + 50; 
            balls.push(new Ball(x, y, type));
        }

        function clearArena() { balls = []; particles = []; lasers = []; pools = []; }

        function checkCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i]; const b2 = balls[j];
                    const dx = b2.x - b1.x; const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < b1.radius + b2.radius) {
                        const angle = Math.atan2(dy, dx);
                        if (b1.type === 'black hole' && b2.type === 'black hole') { triggerGlobalNuke(b1); return; }
                        
                        // Nerf: Min spawn rate is now 1.0s (was 0.1s)
                        if (b1.type === 'randomizer') b1.baseSpawnTime = Math.max(1.0, b1.baseSpawnTime - 0.02);
                        if (b2.type === 'randomizer') b2.baseSpawnTime = Math.max(1.0, b2.baseSpawnTime - 0.02);

                        if (b1.type === 'black hole') b2.takeDamage(b2.maxHp * 5, b1);
                        else if (b2.type === 'black hole') b1.takeDamage(b1.maxHp * 5, b2);

                        const push = 0.4;
                        if (b1.type !== 'black hole') { b1.vx -= Math.cos(angle) * push; b1.vy -= Math.sin(angle) * push; b1.vx *= COLLISION_BOOST; b1.vy *= COLLISION_BOOST; }
                        if (b2.type !== 'black hole') { b2.vx += Math.cos(angle) * push; b2.vy += Math.sin(angle) * push; b2.vx *= COLLISION_BOOST; b2.vy *= COLLISION_BOOST; }

                        if (b1.type === 'unarmed') b2.takeDamage(Math.round(Math.hypot(b1.vx, b1.vy)), b1);
                        if (b2.type === 'unarmed') b1.takeDamage(Math.round(Math.hypot(b2.vx, b2.vy)), b2);
                    }
                    checkWeaponHit(b1, b2); checkWeaponHit(b2, b1);
                }
            }
        }

        function checkWeaponHit(attacker, victim) {
            if (attacker.hitCooldown > 0) return;
            if (victim.id === attacker.creatorId || attacker.id === victim.creatorId) return;
            if (['zen', 'nuke', 'black hole', 'randomizer', 'eggthrower'].includes(attacker.type)) return;
            let hit = false; let damage = 0;

            if (attacker.type === 'sword') {
                const sX = attacker.x + Math.cos(attacker.swordAngle) * 35;
                const sY = attacker.y + Math.sin(attacker.swordAngle) * 35;
                if (Math.hypot(sX - victim.x, sY - victim.y) < victim.radius + 8) { hit = true; damage = attacker.swordDmg || 5; }
            } else if (attacker.type === 'dagger') {
                const dX = attacker.x + Math.cos(attacker.swingAngle) * 30;
                const dY = attacker.y + Math.sin(attacker.swingAngle) * 30;
                if (Math.hypot(dX - victim.x, dY - victim.y) < victim.radius + 4) { hit = true; damage = attacker.daggerDmg || 1; }
            } else if (attacker.type === 'heartstealer') {
                const wX = attacker.x + Math.cos(attacker.wandAngle) * 38;
                const wY = attacker.y + Math.sin(attacker.wandAngle) * 38;
                if (Math.hypot(wX - victim.x, wY - victim.y) < victim.radius + 10) { hit = true; damage = attacker.wandDmg || 1; }
            } else if (attacker.type === 'dark magician') {
                const bX = attacker.x + Math.cos(attacker.bookAngle) * 35;
                const bY = attacker.y + Math.sin(attacker.bookAngle) * 35;
                if (Math.hypot(bX - victim.x, bY - victim.y) < victim.radius + 8) {
                    hit = true; damage = 2;
                    if (!attacker.isClone && balls.length < 50) {
                        setTimeout(() => balls.push(new Ball(attacker.x, attacker.y, victim.type, true, attacker.nextCloneHp, -1, attacker.id)), 30);
                    }
                }
            } else if (attacker.type === 'slammer') {
                if (Math.hypot(attacker.x - victim.x, attacker.y - victim.y) < victim.radius + attacker.radius + 5) { hit = true; damage = 1; }
            }

            if (hit) { victim.takeDamage(damage, attacker); attacker.hitCooldown = 12; }
        }

        function updateStatsUI() {
            if (balls.length === 0) { 
                statsPanel.innerHTML = '<div class="text-[10px] opacity-50 lowercase p-2">empty arena</div>'; 
                return; 
            }
            statsPanel.innerHTML = balls.map(b => {
                const primary = b.getPrimaryStat();
                const hpPercent = Math.max(0, (b.hp / b.maxHp) * 100);
                const borderColor = b.color === '#000000' && b.type !== 'black hole' ? '#555' : (b.type === 'black hole' ? '#4f46e5' : b.color);
                return `
                    <div class="stats-card p-2 text-[10px] rounded shadow-sm border-l-4 flex-shrink-0" style="border-color: ${borderColor}">
                        <div class="flex justify-between items-start gap-1">
                            <div class="font-bold lowercase truncate w-20 text-white leading-none">${b.type}${b.isClone ? '*' : ''}</div>
                            <span class="font-mono text-blue-400 bg-blue-900/30 px-1 rounded">${Math.ceil(b.hp)}</span>
                        </div>
                        <div class="w-full bg-slate-800 h-1 mt-1 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 transition-all duration-300" style="width: ${hpPercent}%"></div>
                        </div>
                        <div class="flex flex-col gap-0.5 mt-1.5">
                            <div class="flex justify-between gap-2 uppercase tracking-tighter">
                               <span class="opacity-40 text-[9px]">${primary.label}:</span>
                               <span class="font-bold text-slate-200">${primary.val}</span>
                            </div>
                            <div class="flex justify-between gap-2 uppercase tracking-tighter">
                               <span class="opacity-40 text-[9px]">vel:</span>
                               <span class="text-slate-400">${Math.round(Math.hypot(b.vx, b.vy))}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }

        let lastStatUpdate = 0;
        function loop(timestamp) {
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#111827'; ctx.fillRect(0, height - STATS_HEIGHT, width, STATS_HEIGHT);

            // Draw pools
            for (let i = pools.length - 1; i >= 0; i--) {
                const p = pools[i]; p.life -= 0.0166;
                if (p.life <= 0) pools.splice(i, 1);
                else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(254, 240, 138, ${Math.min(0.3, p.life)})`;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r/2, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(234, 179, 8, ${Math.min(0.5, p.life)})`;
                    ctx.fill();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); }
            }
            ctx.globalAlpha = 1;
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i]; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = l.life/2;
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                l.life--; if (l.life <= 0) lasers.splice(i, 1);
            }

            checkCollisions();
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i]; b.update(); b.draw();
                if (b.hp <= 0) { createParticles(b.x, b.y, b.color); balls.splice(i, 1); }
            }

            if (timestamp - lastStatUpdate > 100) { updateStatsUI(); lastStatUpdate = timestamp; }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        spawnBall('zen');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
