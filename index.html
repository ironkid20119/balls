<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>VS. Balls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        .stats-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border-left: 4px solid;
            min-width: 150px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease;
        }
        input[type="number"], input[type="text"] {
            font-size: 16px !important;
        }
        #stats-panel::-webkit-scrollbar {
            height: 4px;
        }
        #stats-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        #flashbang {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
        .menu-hidden {
            display: none !important;
        }
        .spawn-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .spawn-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="flashbang"></div>

    <!-- Team Selection Modal -->
    <div id="team-modal" class="menu-hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl lowercase">
            <h2 class="text-lg font-bold mb-4 text-amber-400">spawn teams</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- Team A -->
                <div class="bg-blue-900/20 p-3 rounded-xl border border-blue-500/30">
                    <span class="text-[10px] text-blue-400 font-bold block mb-2 uppercase tracking-widest">team alpha</span>
                    <div id="team-a-slots" class="space-y-2">
                        <select class="team-a-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                        <select class="team-a-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                        <select class="team-a-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                    </div>
                </div>
                <!-- Team B -->
                <div class="bg-red-900/20 p-3 rounded-xl border border-red-500/30">
                    <span class="text-[10px] text-red-400 font-bold block mb-2 uppercase tracking-widest">team omega</span>
                    <div id="team-b-slots" class="space-y-2">
                        <select class="team-b-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                        <select class="team-b-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                        <select class="team-b-select w-full bg-slate-800 border border-slate-700 rounded p-1 text-xs text-white"></select>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex gap-2">
                <button onclick="confirmTeamSpawn()" class="flex-1 bg-amber-600 hover:bg-amber-500 py-3 rounded-lg font-bold text-sm transition-colors shadow-lg">deploy match</button>
                <button onclick="closeTeamModal()" class="px-4 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg text-sm transition-colors">cancel</button>
            </div>
        </div>
    </div>

    <!-- Custom Config Modal -->
    <div id="custom-modal" class="menu-hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl lowercase">
            <h2 class="text-lg font-bold mb-4 text-cyan-400">custom ball config</h2>
            
            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 spawn-scroll">
                <div class="space-y-3">
                    <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                        <label class="text-[10px] text-cyan-500 font-bold block mb-2 uppercase tracking-widest">combat stats</label>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <span class="text-[9px] text-slate-500 block">starting damage</span>
                                <input type="text" id="c-dmg" placeholder="5" value="5" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-white outline-none focus:border-cyan-500">
                            </div>
                            <div>
                                <span class="text-[9px] text-slate-500 block">dmg per hit (+scaling)</span>
                                <input type="text" id="c-dmg-add" placeholder="1" value="1" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-white outline-none focus:border-cyan-500">
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                        <label class="text-[10px] text-emerald-500 font-bold block mb-2 uppercase tracking-widest">physics/movement</label>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <span class="text-[9px] text-slate-500 block">min speed</span>
                                <input type="text" id="c-min-spd" placeholder="2" value="2" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-white outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <span class="text-[9px] text-slate-500 block">max speed</span>
                                <input type="text" id="c-max-spd" placeholder="30" value="30" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-2 text-white outline-none focus:border-emerald-500">
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-2 uppercase tracking-widest">select abilities</label>
                    <div class="grid grid-cols-2 gap-2" id="ability-toggles"></div>
                </div>
            </div>

            <div class="mt-6 flex gap-2">
                <button onclick="confirmCustomSpawn()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 py-3 rounded-lg font-bold text-sm transition-colors shadow-lg shadow-cyan-900/20">spawn custom</button>
                <button onclick="closeCustomModal()" class="px-4 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg text-sm transition-colors">cancel</button>
            </div>
        </div>
    </div>

    <!-- Main Control Bar -->
    <div class="fixed top-4 left-4 z-50 flex flex-col gap-2">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold lowercase text-slate-500">vs. balls</h1>
            <button id="spawn-toggle-btn" onclick="toggleMenu()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-bold shadow-lg transition-all lowercase">
                spawn
            </button>
            <button onclick="clearArena()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition shadow-lg lowercase">
                clear
            </button>
        </div>
        
        <div id="spawn-menu" class="menu-hidden bg-slate-900/95 backdrop-blur-md p-4 rounded-xl border border-slate-700 shadow-2xl flex flex-col gap-3 w-56">
            <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-2">
                <label class="text-[10px] lowercase text-slate-400 font-bold">base hp:</label>
                <input type="text" id="default-hp" value="100" class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-1 outline-none text-blue-400 text-right text-base font-mono">
            </div>

            <div class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1 spawn-scroll">
                <button onclick="openTeamModal()" class="col-span-2 px-2 py-3 bg-amber-500 text-black hover:bg-amber-400 rounded text-xs font-bold transition-colors lowercase">spawn teams</button>
                <button onclick="openCustomModal()" class="col-span-2 px-2 py-3 bg-cyan-500 text-black hover:bg-cyan-400 rounded text-xs font-bold transition-colors lowercase">custom ball</button>
                <button onclick="spawnBall('gargantuan')" class="col-span-2 px-2 py-3 bg-red-900 border border-red-500/50 hover:bg-red-800 rounded text-xs font-bold transition-colors lowercase text-white">gargantuan</button>
                <button onclick="spawnBall('sword')" class="px-2 py-2 bg-blue-600/20 border border-blue-500/30 hover:bg-blue-500/40 rounded text-xs transition lowercase">sword</button>
                <button onclick="spawnBall('laser')" class="px-2 py-2 bg-red-600/20 border border-red-500/30 hover:bg-red-500/40 rounded text-xs transition lowercase">laser</button>
                <button onclick="spawnBall('unarmed')" class="px-2 py-2 bg-green-600/20 border border-green-500/30 hover:bg-green-500/40 rounded text-xs transition lowercase">unarmed</button>
                <button onclick="spawnBall('dark magician')" class="px-2 py-2 bg-purple-600/20 border border-purple-500/30 hover:bg-purple-500/40 rounded text-xs transition lowercase">mage</button>
                <button onclick="spawnBall('randomizer')" class="px-2 py-2 bg-cyan-600/20 border border-cyan-500/30 hover:bg-cyan-500/40 rounded text-xs transition lowercase">random</button>
                <button onclick="spawnBall('dagger')" class="px-2 py-2 bg-yellow-600/20 border border-yellow-500/30 hover:bg-yellow-500/40 rounded text-xs transition lowercase">dagger</button>
                <button onclick="spawnBall('heartstealer')" class="px-2 py-2 bg-pink-500/20 border border-pink-500/30 hover:bg-pink-500/40 rounded text-xs transition lowercase">heart</button>
                <button onclick="spawnBall('eggthrower')" class="px-2 py-2 bg-yellow-100/20 border border-yellow-200/30 hover:bg-yellow-100/40 rounded text-xs transition lowercase text-yellow-200">egg</button>
                <button onclick="spawnBall('demolitionist')" class="px-2 py-2 bg-orange-700/20 border border-orange-500/30 hover:bg-orange-600/40 rounded text-xs transition lowercase text-orange-400">demo</button>
                <button onclick="spawnBall('black hole')" class="px-2 py-2 bg-indigo-950/40 border border-indigo-400/30 hover:bg-indigo-900/60 rounded text-xs transition lowercase">void</button>
                <button onclick="spawnBall('zen')" class="px-2 py-2 bg-zinc-900/40 border border-zinc-700 hover:bg-zinc-800 rounded text-xs transition lowercase">zen</button>
                <button onclick="spawnBall('slammer')" class="px-2 py-2 bg-orange-600/20 border border-orange-500/30 hover:bg-orange-500/40 rounded text-xs transition lowercase">slam</button>
                <button onclick="spawnBall('nuke')" class="px-2 py-2 bg-white text-black hover:bg-slate-200 rounded text-xs font-bold transition lowercase">nuke</button>
            </div>
        </div>
    </div>

    <div id="stats-panel" class="fixed bottom-0 left-0 right-0 z-50 flex gap-2 p-4 overflow-x-auto whitespace-nowrap bg-slate-900/80 backdrop-blur-md border-t border-slate-700 pointer-events-auto min-h-[110px]">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statsPanel = document.getElementById('stats-panel');
        const flashbang = document.getElementById('flashbang');
        const hpInput = document.getElementById('default-hp');
        const spawnMenu = document.getElementById('spawn-menu');
        const customModal = document.getElementById('custom-modal');
        const teamModal = document.getElementById('team-modal');

        let width, height;
        let balls = [];
        let particles = [];
        let lasers = [];
        let pools = []; 
        let visuals = [];
        
        let screenShake = 0;
        const BASE_DRAG = 0.999; 
        const BOUNCE = 1.0; 
        const COLLISION_BOOST = 1.05; 
        const BALL_RADIUS = 22;
        const STATS_HEIGHT = 110;

        const TYPES = ['sword', 'laser', 'unarmed', 'dark magician', 'dagger', 'heartstealer', 'slammer', 'eggthrower', 'demolitionist', 'black hole', 'zen', 'nuke', 'gargantuan', 'randomizer'];

        function formatNum(n) {
            if (n === null || n === undefined) return '0';
            const val = parseFloat(n);
            if (isNaN(val)) return '0';
            if (val === 0) return '0';
            if (Math.abs(val) < 1000000 && Math.abs(val) >= 0.01) {
                return val.toLocaleString(undefined, { maximumFractionDigits: 1 });
            }
            return val.toExponential(2).replace('+', '');
        }

        function parseNum(str) {
            const val = parseFloat(str);
            return isNaN(val) ? 0 : val;
        }

        function toggleMenu() {
            const isHidden = spawnMenu.classList.contains('menu-hidden');
            const btn = document.getElementById('spawn-toggle-btn');
            if (isHidden) {
                spawnMenu.classList.remove('menu-hidden');
                btn.style.backgroundColor = '#475569';
            } else {
                spawnMenu.classList.add('menu-hidden');
                btn.style.backgroundColor = '#2563eb';
            }
        }

        function openCustomModal() {
            customModal.classList.remove('menu-hidden');
            const container = document.getElementById('ability-toggles');
            container.innerHTML = TYPES.map(t => `
                <label class="flex items-center gap-2 p-2 bg-slate-800/80 rounded border border-slate-700/50 cursor-pointer hover:bg-slate-700 transition-colors">
                    <input type="checkbox" value="${t}" class="ability-checkbox w-4 h-4 rounded accent-cyan-500">
                    <span class="text-[10px] font-bold uppercase tracking-tighter opacity-70">${t}</span>
                </label>
            `).join('');
        }

        function closeCustomModal() { customModal.classList.add('menu-hidden'); }

        function confirmCustomSpawn() {
            const selectedAbilities = Array.from(document.querySelectorAll('.ability-checkbox:checked')).map(cb => cb.value);
            const config = {
                dmg: parseNum(document.getElementById('c-dmg').value),
                dmgAdd: parseNum(document.getElementById('c-dmg-add').value),
                minSpd: parseNum(document.getElementById('c-min-spd').value),
                maxSpd: parseNum(document.getElementById('c-max-spd').value),
                abilities: selectedAbilities
            };
            spawnBall('custom', config);
            closeCustomModal();
        }

        function openTeamModal() {
            teamModal.classList.remove('menu-hidden');
            const selects = document.querySelectorAll('.team-a-select, .team-b-select');
            selects.forEach(sel => {
                sel.innerHTML = `<option value="">none</option>` + TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
            });
        }

        function closeTeamModal() { teamModal.classList.add('menu-hidden'); }

        function confirmTeamSpawn() {
            const teamA = Array.from(document.querySelectorAll('.team-a-select')).map(s => s.value).filter(v => v !== "");
            const teamB = Array.from(document.querySelectorAll('.team-b-select')).map(s => s.value).filter(v => v !== "");
            
            // Spawn Team A on Left
            teamA.forEach((type, i) => {
                const x = 150;
                const y = (height - STATS_HEIGHT) * ((i + 1) / (teamA.length + 1));
                const b = new Ball(x, y, type);
                b.teamId = 'alpha';
                balls.push(b);
            });

            // Spawn Team B on Right
            teamB.forEach((type, i) => {
                const x = width - 150;
                const y = (height - STATS_HEIGHT) * ((i + 1) / (teamB.length + 1));
                const b = new Ball(x, y, type);
                b.teamId = 'omega';
                balls.push(b);
            });

            closeTeamModal();
        }

        class Ball {
            constructor(x, y, type, isClone = false, cloneHp = 100, lifeSpan = -1, creatorId = null, customConfig = null) {
                this.id = Math.random().toString(36).substr(2, 5);
                this.creatorId = creatorId;
                this.teamId = null; 
                this.x = x;
                this.y = y;
                
                this.type = type;
                if (this.type === 'zen' && Math.random() < (1 / 7.5)) {
                    this.type = 'dvd';
                }

                this.customConfig = customConfig;
                
                const isBlackHole = this.hasAbility('black hole');
                const speedScale = isBlackHole ? 0.5 : 10;
                this.vx = (Math.random() - 0.5) * speedScale;
                this.vy = (Math.random() - 0.5) * speedScale;
                
                this.isClone = isClone; 
                this.radius = BALL_RADIUS;
                if (this.hasAbility('gargantuan')) {
                    this.radius = BALL_RADIUS * (10/3); 
                }
                this.visualRadius = this.radius;
                this.lifeSpan = lifeSpan; 
                
                let baseHp = parseNum(hpInput.value) || 100;
                if (this.hasAbility('gargantuan')) baseHp *= 5;

                const startHp = isClone ? cloneHp : baseHp;
                this.hp = startHp;
                this.maxHp = startHp;
                
                this.color = this.getColor();
                this.hitCooldown = 0;
                this.stunTimer = 0;
                
                // Track dynamic limits for Unarmed
                this.unarmedMin = customConfig ? customConfig.minSpd : 2;
                this.unarmedMax = customConfig ? customConfig.maxSpd : 30;

                this.setupType();
            }

            getColor() {
                if (this.type === 'custom') return '#06b6d4';
                switch(this.type) {
                    case 'gargantuan': return '#450a0a';
                    case 'sword': return '#3b82f6';
                    case 'laser': return '#ef4444';
                    case 'unarmed': return '#22c55e';
                    case 'dark magician': return '#a855f7';
                    case 'dagger': return '#eab308';
                    case 'heartstealer': return '#ec4899';
                    case 'eggthrower': return '#fef3c7';
                    case 'demolitionist': return '#f97316';
                    case 'black hole': return '#000000';
                    case 'zen': return '#1e293b';
                    case 'dvd': return '#ffffff'; 
                    case 'slammer': return '#ea580c';
                    case 'nuke': return '#ffffff';
                    case 'randomizer': return '#06b6d4';
                    default: return '#ffffff';
                }
            }

            hasAbility(name) {
                if (this.type === name) return true;
                if (this.type === 'dvd' && name === 'zen') return true; 
                return this.customConfig && this.customConfig.abilities.includes(name);
            }

            setupType() {
                const cfg = this.customConfig;
                if (this.hasAbility('sword')) { this.swordDmg = cfg ? cfg.dmg : 5; this.swordAngle = 0; }
                if (this.hasAbility('laser')) { this.laserTimer = 0; this.laserCooldown = 1000; this.laserDmg = cfg ? cfg.dmg : 3; }
                if (this.hasAbility('dark magician')) { this.bookAngle = 0; this.nextCloneHp = cfg ? cfg.dmgAdd * 10 : 10; }
                if (this.hasAbility('dagger')) { this.swingSpeed = 1.5; this.swingAngle = 0; this.daggerDmg = cfg ? cfg.dmg : 1; }
                if (this.hasAbility('heartstealer')) { this.wandDmg = cfg ? cfg.dmg : 1; this.wandAngle = 0; }
                if (this.hasAbility('eggthrower')) { 
                    this.eggAngle = 0; this.eggDmg = cfg ? cfg.dmg : 3; 
                    this.isEggThrown = false; this.eggReturnTimer = 0; this.eggCooldown = 0; this.eggX = 0; this.eggY = 0; this.totalDamageAdded = 0;
                }
                if (this.hasAbility('demolitionist')) { this.demoDmg = cfg ? cfg.dmg : 5; this.totalHits = 0; }
                if (this.hasAbility('black hole')) { this.fixedSpeed = 0.4; }
                if (this.hasAbility('slammer')) { 
                    this.slamHits = 0; 
                    this.slamTimer = 3.0;
                    this.slamBaseDmg = cfg ? cfg.dmg : 10; 
                }
                if (this.hasAbility('nuke')) { this.nukeTimer = 20; this.isCharging = false; this.chargeTimer = 2.5; }
                if (this.hasAbility('randomizer')) { this.spawnTimer = 2.5; this.baseSpawnTime = 2.5; }
                if (this.hasAbility('gargantuan')) { this.gargantuanDmgMod = 0.05; }
                if (this.type === 'dvd') { 
                    this.dvdColor = `hsl(${Math.random() * 360}, 100%, 60%)`; 
                }
            }

            update() {
                const cfg = this.customConfig;
                // Use dynamic unarmed limits if applicable
                const minSpd = this.hasAbility('unarmed') ? this.unarmedMin : (cfg ? cfg.minSpd : 2);
                const maxSpd = this.hasAbility('unarmed') ? this.unarmedMax : (cfg ? cfg.maxSpd : 30);

                if (this.stunTimer > 0) {
                    this.stunTimer -= 0.0166;
                    this.vx *= 0.9; this.vy *= 0.9;
                }

                if (this.lifeSpan > 0) {
                    this.lifeSpan -= 0.0166;
                    if (this.lifeSpan <= 0) this.hp = 0;
                }

                if (this.hasAbility('black hole')) {
                    const angle = Math.atan2(this.vy, this.vx);
                    this.vx = Math.cos(angle) * (this.fixedSpeed || 0.4);
                    this.vy = Math.sin(angle) * (this.fixedSpeed || 0.4);
                    balls.forEach(other => {
                        if (other === this || (this.teamId && this.teamId === other.teamId)) return;
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const dist = Math.hypot(dx, dy);
                        const horizon = 250;
                        if (dist < horizon && dist > 1) {
                            const normalized = (horizon - dist) / horizon;
                            const force = Math.pow(normalized, 3) * 1.5; 
                            other.vx += (dx / dist) * force;
                            other.vy += (dy / dist) * force;
                        }
                    });
                } else {
                    let speed = Math.hypot(this.vx, this.vy);
                    const dragFactor = BASE_DRAG - (Math.pow(speed / maxSpd, 2) * 0.05);
                    this.vx *= dragFactor;
                    this.vy *= dragFactor;
                }
                
                this.x += this.vx;
                this.y += this.vy;

                if (!this.hasAbility('black hole')) {
                    let speed = Math.hypot(this.vx, this.vy);
                    if (speed > maxSpd) {
                        this.vx = (this.vx / speed) * maxSpd;
                        this.vy = (this.vy / speed) * maxSpd;
                    } else if (speed < minSpd && speed > 0) {
                        this.vx = (this.vx / speed) * minSpd;
                        this.vy = (this.vy / speed) * minSpd;
                    }
                }

                // Wall Collisions
                let hitWall = false;
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -BOUNCE; hitWall = true; }
                if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -BOUNCE; hitWall = true; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -BOUNCE; hitWall = true; }
                const playHeight = height - STATS_HEIGHT;
                if (this.y + this.radius > playHeight) { this.y = playHeight - this.radius; this.vy *= -BOUNCE; hitWall = true; }

                if (hitWall) {
                    if (this.hasAbility('gargantuan')) {
                        screenShake = Math.max(screenShake, 10);
                    }
                    if (this.type === 'dvd') {
                        this.dvdColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
                    }
                }

                pools.forEach(pool => {
                    if (Math.hypot(this.x - pool.x, this.y - pool.y) < this.radius + pool.r) this.stunTimer = 0.5;
                });

                // Ability cycles
                if (this.hasAbility('sword')) this.swordAngle += 0.1;
                if (this.hasAbility('dagger')) this.swingAngle += 0.1 * (this.swingSpeed || 1.5);
                if (this.hasAbility('heartstealer')) this.wandAngle += 0.12;
                if (this.hasAbility('dark magician')) this.bookAngle += 0.05;
                
                if (this.hasAbility('eggthrower')) {
                    if (this.eggCooldown > 0) this.eggCooldown -= 0.0166;
                    if (!this.isEggThrown) {
                        this.eggAngle += 0.15;
                        this.eggX = this.x + Math.cos(this.eggAngle) * (this.radius + 18);
                        this.eggY = this.y + Math.sin(this.eggAngle) * (this.radius + 18);
                        if (this.eggCooldown <= 0) {
                            let target = null; let minDist = 300;
                            balls.forEach(b => {
                                if (b === this || b.creatorId === this.id || (this.teamId && this.teamId === b.teamId)) return;
                                let d = Math.hypot(this.x - b.x, this.y - b.y);
                                if (d < minDist) { minDist = d; target = b; }
                            });
                            if (target) {
                                this.isEggThrown = true; this.eggCooldown = 1.5;
                                let angleToTarget = Math.atan2(target.y - this.eggY, target.x - this.eggX);
                                this.eggVX = Math.cos(angleToTarget) * 10; this.eggVY = Math.sin(angleToTarget) * 10;
                            }
                        }
                    } else {
                        this.eggX += this.eggVX; this.eggY += this.eggVY; this.eggReturnTimer++;
                        balls.forEach(b => {
                            if (b === this || b.id === this.creatorId || (this.teamId && this.teamId === b.teamId)) return;
                            if (Math.hypot(this.eggX - b.x, this.eggY - b.y) < b.radius + 8) {
                                b.takeDamage(this.eggDmg, this);
                                this.eggDmg += (cfg ? cfg.dmgAdd * 3 : 3);
                                pools.push({ x: this.eggX, y: this.eggY, r: 40, life: 5 });
                                this.resetEgg();
                            }
                        });
                        if (this.eggReturnTimer > 60 || this.eggX < 0 || this.eggX > width || this.eggY < 0 || this.eggY > height - STATS_HEIGHT) this.resetEgg();
                    }
                }
                if (this.hasAbility('laser')) {
                    this.laserTimer += 16.6; 
                    if (this.laserTimer >= this.laserCooldown) { this.shootLaser(); this.laserTimer = 0; }
                }
                if (this.hasAbility('randomizer')) {
                    this.spawnTimer -= 0.0166;
                    if (this.spawnTimer <= 0) {
                        this.spawnTimer = this.baseSpawnTime;
                        const randomType = TYPES[Math.floor(Math.random() * TYPES.length)];
                        const b = new Ball(this.x, this.y, randomType, true, 50, 5, this.id);
                        b.teamId = this.teamId;
                        balls.push(b);
                    }
                }
                if (this.hasAbility('nuke')) {
                    if (!this.isCharging) {
                        this.nukeTimer -= 0.0166;
                        if (this.nukeTimer <= 0) {
                            this.nukeTimer = 0;
                            this.isCharging = true;
                        }
                    } else {
                        this.chargeTimer -= 0.0166;
                        if (this.chargeTimer <= 0) triggerGlobalNuke(this);
                    }
                }
                
                if (this.hasAbility('slammer')) {
                    this.slamTimer -= 0.0166;
                    if (this.slamTimer <= 0) {
                        this.triggerSlamJump();
                        this.slamTimer = 3.0;
                    }
                }

                if (this.hitCooldown > 0) this.hitCooldown--;
            }

            triggerSlamJump() {
                let nearest = null; let minDist = Infinity;
                balls.forEach(b => {
                    if (b === this || b.id === this.creatorId || b.creatorId === this.id || (this.teamId && this.teamId === b.teamId)) return;
                    const d = Math.hypot(this.x - b.x, this.y - b.y);
                    if (d < minDist) { minDist = d; nearest = b; }
                });

                if (nearest) {
                    const angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                    const force = 25;
                    this.vx = Math.cos(angle) * force;
                    this.vy = Math.sin(angle) * force;
                    visuals.push({ x: this.x, y: this.y, r: 0, maxR: 60, life: 1, color: '#ea580c' });
                }
            }

            resetEgg() { this.isEggThrown = false; this.eggReturnTimer = 0; }

            shootLaser() {
                let nearest = null; let minDist = Infinity;
                balls.forEach(b => {
                    if (b === this || b.id === this.creatorId || b.creatorId === this.id || (this.teamId && this.teamId === b.teamId)) return;
                    const d = Math.hypot(this.x - b.x, this.y - b.y);
                    if (d < minDist) { minDist = d; nearest = b; }
                });
                if (nearest) {
                    lasers.push({ x1: this.x, y1: this.y, x2: nearest.x, y2: nearest.y, life: 10 });
                    nearest.takeDamage(this.laserDmg || 3, this);
                }
            }

            takeDamage(dmg, owner) {
                if (this.hasAbility('zen')) return; 
                if (owner && (owner.id === this.creatorId || owner.creatorId === this.id)) return;
                if (owner && this.teamId && this.teamId === owner.teamId) return; 
                
                this.hp -= dmg;
                createParticles(this.x, this.y, this.color);
                
                if (owner) {
                    const add = owner.customConfig ? owner.customConfig.dmgAdd : 1;
                    if (owner.hasAbility('sword')) owner.swordDmg += add;
                    if (owner.hasAbility('laser')) owner.laserCooldown = Math.max(50, owner.laserCooldown - 20);
                    if (owner.hasAbility('dagger')) owner.swingSpeed += (add * 0.1);
                    if (owner.hasAbility('dark magician')) owner.nextCloneHp += add;
                    if (owner.hasAbility('heartstealer')) { owner.wandDmg += (add * 0.5); owner.hp += Math.min(dmg, 20); }
                    if (owner.hasAbility('slammer')) owner.slamHits += add;
                    
                    // Unarmed Scaling: +1 to min and max speed bounds on hit
                    if (owner.hasAbility('unarmed')) {
                        owner.unarmedMin += 1;
                        owner.unarmedMax += 1;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.hasAbility('black hole')) {
                    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 45);
                    grad.addColorStop(0, 'rgba(79, 70, 229, 0.7)');
                    grad.addColorStop(0.4, 'rgba(0, 0, 0, 1)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill();
                }

                if (this.type === 'dvd') {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.dvdColor;
                    ctx.fillStyle = this.dvdColor;
                    ctx.font = "bold 16px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("DVD", 0, -2);
                    ctx.beginPath();
                    ctx.ellipse(0, 8, 14, 4, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = this.dvdColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 0; 
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.visualRadius || this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color; ctx.fill();
                }
                
                if (this.teamId === 'alpha') {
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 5;
                } else if (this.teamId === 'omega') {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 5;
                } else {
                    ctx.strokeStyle = this.isClone || this.lifeSpan > 0 ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 3;
                }
                if (this.type !== 'dvd') ctx.stroke();

                ctx.fillStyle = 'white';
                if (this.hasAbility('eggthrower')) ctx.fillStyle = 'black';
                
                ctx.font = `bold ${this.hasAbility('gargantuan') ? 16 : 10}px monospace`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                let label = formatNum(this.hp);
                if (this.hasAbility('nuke')) {
                   if (this.isCharging) label = "!!!";
                   else label = Math.ceil(this.nukeTimer);
                }
                
                if (this.type !== 'dvd') ctx.fillText(label, 0, 0);

                const offset = this.radius + 10;
                if (this.hasAbility('sword')) {
                    ctx.rotate(this.swordAngle);
                    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(offset, -4, 25, 8);
                }
                if (this.hasAbility('dark magician')) {
                    ctx.rotate(this.bookAngle);
                    ctx.fillStyle = '#fef3c7'; ctx.fillRect(offset, -8, 16, 16);
                }
                if (this.hasAbility('heartstealer')) {
                    ctx.rotate(this.wandAngle);
                    ctx.fillStyle = '#f9a8d4'; ctx.fillRect(offset, -2, 18, 4);
                }
                if (this.hasAbility('dagger')) {
                    ctx.rotate(this.swingAngle);
                    ctx.fillStyle = '#fde047'; ctx.fillRect(offset, -2, 15, 4);
                }
                ctx.restore();

                if (this.hasAbility('eggthrower')) {
                    ctx.save(); ctx.translate(this.eggX, this.eggY);
                    ctx.beginPath(); ctx.ellipse(0, 0, 8, 10, 0, 0, Math.PI*2);
                    ctx.fillStyle = 'white'; ctx.fill(); ctx.restore();
                }
            }

            getStats() {
                let s = [];
                const cfg = this.customConfig;
                if (this.teamId) s.push({ k: 'team', v: this.teamId });
                if (this.hasAbility('sword')) s.push({ k: 'sword', v: formatNum(this.swordDmg) });
                if (this.hasAbility('laser')) s.push({ k: 'laser', v: formatNum(this.laserDmg) + ' (' + (1000/this.laserCooldown).toFixed(1) + '/s)' });
                if (this.hasAbility('slammer')) s.push({ k: 'jump', v: Math.ceil(this.slamTimer) + 's', k2: 'dmg', v2: formatNum(this.slamBaseDmg + (this.slamHits * 2.5)) });
                if (this.hasAbility('eggthrower')) s.push({ k: 'egg', v: formatNum(this.eggDmg) });
                if (this.hasAbility('demolitionist')) s.push({ k: 'demo', v: formatNum(this.demoDmg) });
                if (this.hasAbility('dark magician')) s.push({ k: 'clone', v: formatNum(this.nextCloneHp) + 'hp' });
                if (this.hasAbility('heartstealer')) s.push({ k: 'heart', v: formatNum(this.wandDmg) });
                
                // Show Unarmed scaling stats
                if (this.hasAbility('unarmed')) {
                    s.push({ k: 'dmg', v: formatNum(Math.hypot(this.vx, this.vy)) });
                    s.push({ k: 'max', v: formatNum(this.unarmedMax) });
                } else {
                    s.push({ k: 'spd', v: formatNum(Math.hypot(this.vx, this.vy)) });
                }
                
                return s;
            }
        }

        function triggerGlobalNuke(source) {
            flashbang.style.transition = "none";
            flashbang.style.opacity = "1";
            setTimeout(() => { flashbang.style.transition = "opacity 3.5s ease-out"; flashbang.style.opacity = "0"; }, 50);
            const currentBalls = [...balls];
            currentBalls.forEach(b => {
                if (b.teamId && b.teamId === source.teamId) return; 
                b.takeDamage(b.maxHp * 10, source);
            });
        }

        function createParticles(x, y, color) {
            const count = color === '#450a0a' ? 12 : 4;
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color });
            }
        }

        function spawnBall(type, customConfig = null) {
            const x = Math.random() * (width - 200) + 100;
            const y = Math.random() * (height - STATS_HEIGHT - 200) + 100; 
            balls.push(new Ball(x, y, type, false, 100, -1, null, customConfig));
        }

        function clearArena() { balls = []; particles = []; lasers = []; pools = []; visuals = []; screenShake = 0; }

        function checkCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i]; const b2 = balls[j];
                    const dx = b2.x - b1.x; const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < b1.radius + b2.radius) {
                        const angle = Math.atan2(dy, dx);
                        
                        if (b1.hasAbility('gargantuan') || b2.hasAbility('gargantuan')) {
                            screenShake = Math.max(screenShake, 8);
                        }

                        if (b1.hasAbility('black hole') && b2.hasAbility('black hole')) { triggerGlobalNuke(b1); return; }
                        if (b1.hasAbility('randomizer')) b1.baseSpawnTime = Math.max(1.0, b1.baseSpawnTime - 0.02);
                        if (b2.hasAbility('randomizer')) b2.baseSpawnTime = Math.max(1.0, b2.baseSpawnTime - 0.02);
                        if (b1.hasAbility('demolitionist')) triggerDemolition(b1, b2);
                        if (b2.hasAbility('demolitionist')) triggerDemolition(b2, b1);
                        
                        if (b1.hasAbility('slammer')) {
                            const dmg = b1.slamBaseDmg + (b1.slamHits * 2.5);
                            b2.takeDamage(dmg, b1);
                        }
                        if (b2.hasAbility('slammer')) {
                            const dmg = b2.slamBaseDmg + (b2.slamHits * 2.5);
                            b1.takeDamage(dmg, b2);
                        }

                        if (b1.hasAbility('black hole')) b2.takeDamage(b2.maxHp * 5, b1);
                        else if (b2.hasAbility('black hole')) b1.takeDamage(b1.maxHp * 5, b2);
                        
                        const push = 0.4;
                        if (!b1.hasAbility('black hole')) { 
                            b1.vx -= Math.cos(angle) * push; b1.vy -= Math.sin(angle) * push; 
                            b1.vx *= COLLISION_BOOST; b1.vy *= COLLISION_BOOST; 
                        }
                        if (!b2.hasAbility('black hole')) { 
                            b2.vx += Math.cos(angle) * push; b2.vy += Math.sin(angle) * push; 
                            b2.vx *= COLLISION_BOOST; b2.vy *= COLLISION_BOOST; 
                        }

                        if (b1.hasAbility('gargantuan')) b2.takeDamage(b2.maxHp * b1.gargantuanDmgMod, b1);
                        if (b2.hasAbility('gargantuan')) b1.takeDamage(b1.maxHp * b2.gargantuanDmgMod, b2);

                        // Unarmed: Damage is purely based on current speed
                        if (b1.hasAbility('unarmed')) b2.takeDamage(Math.hypot(b1.vx, b1.vy), b1);
                        if (b2.hasAbility('unarmed')) b1.takeDamage(Math.hypot(b2.vx, b2.vy), b2);
                    }
                    checkWeaponHit(b1, b2); checkWeaponHit(b2, b1);
                }
            }
        }

        function triggerDemolition(demo, target) {
            if (demo.hitCooldown > 0) return;
            const blastRadius = demo.radius * 2.5;
            const currentDmg = demo.demoDmg;
            visuals.push({ x: demo.x, y: demo.y, r: 0, maxR: blastRadius, life: 1, color: '#f97316' });
            balls.forEach(b => {
                if (b === demo || (demo.teamId && demo.teamId === b.teamId)) return;
                const d = Math.hypot(b.x - demo.x, b.y - demo.y);
                if (d < blastRadius + b.radius) b.takeDamage(currentDmg, demo);
            });
            demo.demoDmg += (demo.customConfig ? demo.customConfig.dmgAdd * 1.25 : 1.25);
            demo.hitCooldown = 15;
        }

        function checkWeaponHit(attacker, victim) {
            if (attacker.hitCooldown > 0) return;
            if (victim.id === attacker.creatorId || attacker.id === victim.creatorId) return;
            if (attacker.teamId && attacker.teamId === victim.teamId) return; 
            
            let hit = false; let damage = 0;
            const cfg = attacker.customConfig;
            const offset = attacker.radius + 15;

            if (attacker.hasAbility('sword')) {
                const sX = attacker.x + Math.cos(attacker.swordAngle) * offset;
                const sY = attacker.y + Math.sin(attacker.swordAngle) * offset;
                if (Math.hypot(sX - victim.x, sY - victim.y) < victim.radius + 8) { hit = true; damage = attacker.swordDmg || (cfg?cfg.dmg:5); }
            }
            if (!hit && attacker.hasAbility('dagger')) {
                const dX = attacker.x + Math.cos(attacker.swingAngle) * (offset - 5);
                const dY = attacker.y + Math.sin(attacker.swingAngle) * (offset - 5);
                if (Math.hypot(dX - victim.x, dY - victim.y) < victim.radius + 4) { hit = true; damage = attacker.daggerDmg || (cfg?cfg.dmg:1); }
            }
            if (!hit && attacker.hasAbility('heartstealer')) {
                const wX = attacker.x + Math.cos(attacker.wandAngle) * (offset + 5);
                const wY = attacker.y + Math.sin(attacker.wandAngle) * (offset + 5);
                if (Math.hypot(wX - victim.x, wY - victim.y) < victim.radius + 10) { hit = true; damage = attacker.wandDmg || (cfg?cfg.dmg:1); }
            }
            if (!hit && attacker.hasAbility('dark magician')) {
                const bX = attacker.x + Math.cos(attacker.bookAngle) * offset;
                const bY = attacker.y + Math.sin(attacker.bookAngle) * offset;
                if (Math.hypot(bX - victim.x, bY - victim.y) < victim.radius + 8) {
                    hit = true; damage = 2;
                    if (!attacker.isClone && balls.length < 50) {
                        setTimeout(() => {
                            const b = new Ball(attacker.x, attacker.y, victim.type, true, attacker.nextCloneHp, -1, attacker.id);
                            b.teamId = attacker.teamId;
                            balls.push(b);
                        }, 30);
                    }
                }
            }

            if (hit) { victim.takeDamage(damage, attacker); attacker.hitCooldown = 12; }
        }

        function updateStatsUI() {
            if (balls.length === 0) { statsPanel.innerHTML = '<div class="text-[10px] opacity-50 lowercase p-2">empty arena</div>'; return; }
            const sortedBalls = [...balls].sort((a, b) => b.hp - a.hp);

            statsPanel.innerHTML = sortedBalls.map(b => {
                const subStats = b.getStats();
                const hpPercent = Math.max(0, (b.hp / b.maxHp) * 100);
                const borderColor = (b.teamId === 'alpha') ? '#3b82f6' : (b.teamId === 'omega' ? '#ef4444' : (b.hasAbility('black hole') ? '#4f46e5' : b.color));
                const isDying = b.hp < b.maxHp * 0.2;

                return `
                    <div class="stats-card p-2 text-[10px] rounded shadow-sm border-l-4 flex-shrink-0 ${isDying ? 'animate-pulse' : ''}" style="border-color: ${borderColor}">
                        <div class="flex justify-between items-start gap-1">
                            <div class="font-bold lowercase truncate w-20 text-white leading-none">${b.type}${b.isClone ? '*' : ''}</div>
                            <span class="font-mono text-blue-400 bg-blue-900/30 px-1 rounded">${formatNum(b.hp)}</span>
                        </div>
                        <div class="w-full bg-slate-800 h-1 mt-1 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 transition-all duration-300" style="width: ${hpPercent}%"></div>
                        </div>
                        <div class="flex flex-col gap-0.5 mt-1.5">
                            ${subStats.map(s => `
                                <div class="flex justify-between gap-2 uppercase tracking-tighter">
                                   <span class="opacity-40 text-[9px]">${s.k}:</span>
                                   <span class="font-bold text-slate-200">${s.v}</span>
                                   ${s.k2 ? `
                                     <span class="opacity-40 text-[9px] ml-1">${s.k2}:</span>
                                     <span class="font-bold text-slate-200">${s.v2}</span>
                                   ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }

        let lastStatUpdate = 0;
        function loop(timestamp) {
            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake *= 0.9;
                if (screenShake < 0.1) screenShake = 0;
            }

            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#111827'; ctx.fillRect(0, height - STATS_HEIGHT, width, STATS_HEIGHT);

            for (let i = visuals.length - 1; i >= 0; i--) {
                const v = visuals[i]; v.life -= 0.05; v.r += (v.maxR - v.r) * 0.2;
                if (v.life <= 0) visuals.splice(i, 1);
                else {
                    ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(249, 115, 22, ${v.life * 0.4})`; ctx.fill();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${v.life})`; ctx.stroke();
                }
            }

            for (let i = pools.length - 1; i >= 0; i--) {
                const p = pools[i]; p.life -= 0.0166;
                if (p.life <= 0) pools.splice(i, 1);
                else {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(254, 240, 138, ${Math.min(0.3, p.life)})`; ctx.fill();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); }
            }
            ctx.globalAlpha = 1;
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i]; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = l.life/2;
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                l.life--; if (l.life <= 0) lasers.splice(i, 1);
            }

            checkCollisions();
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i]; b.update(); b.draw();
                if (b.hp <= 0) { createParticles(b.x, b.y, b.color); balls.splice(i, 1); }
            }
            ctx.restore();

            if (timestamp - lastStatUpdate > 100) { updateStatsUI(); lastStatUpdate = timestamp; }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        spawnBall('zen');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
