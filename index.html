                                    b2.storedVx = b2.vx;
                                    b2.storedVy = b2.vy;
                                }
                                b2.frozenTimer = 5;
                                b1.freezeHits = 0;
                                visuals.push({ x: b2.x, y: b2.y, r: 0, maxR: 40, life: 1, color: '#7dd3fc' });
                            }
                        }
                        if (b2.hasAbility('freezer')) {
                            b2.freezeHits++;
                            b1.takeDamage(b2.freezeDmg, b2);
                            if (b2.freezeHits >= 5) {
                                if (b1.frozenTimer <= 0) {
                                    b1.storedVx = b1.vx;
                                    b1.storedVy = b1.vy;
                                }
                                b1.frozenTimer = 5;
                                b2.freezeHits = 0;
                                visuals.push({ x: b1.x, y: b1.y, r: 0, maxR: 40, life: 1, color: '#7dd3fc' });
                            }
                        }

                        let push = 0.4;
                        let push1 = push; let push2 = push;
                        if (!b1.hasAbility('black hole') && !b1.hasAbility('saw')) {
                            b1.vx -= Math.cos(angle) * push2; b1.vy -= Math.sin(angle) * push2;
                            b1.vx *= COLLISION_BOOST; b1.vy *= COLLISION_BOOST;
                        }
                        if (!b2.hasAbility('black hole') && !b2.hasAbility('saw')) {
                            b2.vx += Math.cos(angle) * push1; b2.vy += Math.sin(angle) * push1;
                            b2.vx *= COLLISION_BOOST; b2.vy *= COLLISION_BOOST;
                        }

                        if (b1.hasAbility('gargantuan')) b2.takeDamage(b2.maxHp * b1.gargantuanDmgMod, b1);
                        if (b2.hasAbility('gargantuan')) b1.takeDamage(b1.maxHp * b2.gargantuanDmgMod, b2);
                        
                        // Nerfed ultra unarmed damage from 3.33 to 1.75
                        if (b1.hasAbility('unarmed') && !b2.hasAbility('shapeshield') && !b2.hasAbility('BIRCH TREE')) {
                            let dmg = Math.hypot(b1.vx, b1.vy);
                            if (b1.isUltra) dmg = dmg * 1.75; // Nerfed from 3.33
                            if (b1.hasAbility('deflector')) dmg = 0;
                            b2.takeDamage(dmg, b1);
                        }
                        if (b2.hasAbility('unarmed') && !b1.hasAbility('shapeshield') && !b1.hasAbility('BIRCH TREE')) {
                            let dmg = Math.hypot(b2.vx, b2.vy);
                            if (b2.isUltra) dmg = dmg * 1.75; // Nerfed from 3.33
                            if (b2.hasAbility('deflector')) dmg = 0;
                            b1.takeDamage(dmg, b2);
                        }
                    }
                    checkWeaponHit(b1, b2); checkWeaponHit(b2, b1);
                }
            }
        }

        function triggerDemolition(demo, target, isInfected = false) {
            if (demo.hitCooldown > 0 && !isInfected) return;
            const blastRadius = demo.radius * 2.5;
            const dmg = isInfected ? (demo.demoDmg || 5) : demo.demoDmg;
            visuals.push({ x: demo.x, y: demo.y, r: 0, maxR: blastRadius, life: 1, color: '#f97316' });
            balls.forEach(b => {
                if (b === demo || (demo.teamId && demo.teamId === b.teamId)) return;
                const d = Math.hypot(b.x - demo.x, b.y - demo.y);
                if (d < blastRadius + b.radius) {
                    b.takeDamage(dmg, demo);
                    const angle = Math.atan2(b.y - demo.y, b.x - demo.x);
                    b.applyKnockback(angle, 12);
                }
            });
            // Infected balls also damage themselves
            if (isInfected) {
                demo.takeDamage(dmg * 0.5, demo);
            }
            demo.hitCooldown = 15;
        }

        function triggerUltraHeartExplosion(ball, target) {
            const blastRadius = 75;
            const dmg = ball.wandDmg;
            visuals.push({ x: target.x, y: target.y, r: 0, maxR: blastRadius, life: 1, color: '#ec4899' });
            balls.forEach(b => {
                if (b === ball || (ball.teamId && ball.teamId === b.teamId)) return;
                const d = Math.hypot(b.x - target.x, b.y - target.y);
                if (d < blastRadius + b.radius) {
                    b.takeDamage(dmg, ball);
                    ball.hp += dmg * 0.5;
                    const angle = Math.atan2(b.y - target.y, b.x - target.x);
                    b.applyKnockback(angle, 10);
                }
            });
        }

        function checkWeaponHit(attacker, victim) {
            if (victim.id === attacker.creatorId || attacker.id === victim.creatorId) return;
            if (attacker.teamId && attacker.teamId === victim.teamId) return;
            if (attacker.hasAbility('splitter') && victim.hasAbility('splitter') && attacker.splitterRootId === victim.splitterRootId) return;

            let hit = false;
            let damage = 0;
            let kbForce = 0;
            let kbAngle = 0;

            const offset = attacker.radius + 15;

            const tryHit = (weaponX, weaponY, hitRad, dmg, force, bypass = false) => {
                if (Math.hypot(weaponX - victim.x, weaponY - victim.y) < victim.radius + hitRad) {
                    hit = true;
                    damage = dmg;
                    kbForce = force;
                    kbAngle = Math.atan2(victim.y - weaponY, victim.x - weaponX);
                    victim.takeDamage(damage, attacker, bypass);
                    victim.applyKnockback(kbAngle, kbForce);
                    return true;
                }
                return false;
            };

            if (attacker.hasAbility('sword')) {
                const sLen = attacker.isUltra ? 50 : 25;
                const sX = attacker.x + Math.cos(attacker.swordAngle) * (offset + sLen/2);
                const sY = attacker.y + Math.sin(attacker.swordAngle) * (offset + sLen/2);
                tryHit(sX, sY, 12, attacker.swordDmg, 5);
            }
            if (!hit && attacker.hasAbility('dagger')) {
                const dW = attacker.isUltra ? 15 * 3.33 : 15;
                const dX = attacker.x + Math.cos(attacker.swingAngle) * (offset + dW/2);
                const dY = attacker.y + Math.sin(attacker.swingAngle) * (offset + dW/2);
                tryHit(dX, dY, attacker.isUltra ? 4 * 3.33 : 4, attacker.daggerDmg, 3, attacker.isUltra);
            }
            if (!hit && attacker.hasAbility('heartstealer')) {
                const wX = attacker.x + Math.cos(attacker.wandAngle) * (offset + 5);
                const wY = attacker.y + Math.sin(attacker.wandAngle) * (offset + 5);
                if (tryHit(wX, wY, 10, attacker.wandDmg, 4)) {
                   if (attacker.isUltra) triggerUltraHeartExplosion(attacker, victim);
                }
            }
            if (!hit && attacker.hasAbility('dark magician')) {
                const bX = attacker.x + Math.cos(attacker.bookAngle) * offset;
                const bY = attacker.y + Math.sin(attacker.bookAngle) * offset;
                if (tryHit(bX, bY, 8, 2, 4)) {
                    if (!attacker.isClone && balls.length < settings.maxBalls) {
                        const b = new Ball(attacker.x, attacker.y, victim.type, true, attacker.nextCloneHp, -1, attacker.id);
                        b.teamId = attacker.teamId; balls.push(b);
                    }
                }
            }
            if (!hit && attacker.hasAbility('bonker')) {
                const hAngle = attacker.hammerAngle;
                const tipX = attacker.x + Math.cos(hAngle) * (offset + 25);
                const tipY = attacker.y + Math.sin(hAngle) * (offset + 25);
                if (tryHit(tipX, tipY, 12, attacker.hammerDmg, 10)) {
                    if (Math.random() < attacker.critChance) {
                        damage = (attacker.hammerDmg * 2) + attacker.critBonus;
                        victim.takeDamage(damage, attacker);
                        kbForce *= 2;
                        visuals.push({ x: tipX, y: tipY, r: 5, maxR: 20, life: 1, color: '#fcd34d' });
                    }
                }
            }
            if (!hit && attacker.hasAbility('slapper')) {
                const sAngle = attacker.slapAngle;
                const sX = attacker.x + Math.cos(sAngle) * (offset + 10);
                const sY = attacker.y + Math.sin(sAngle) * (offset + 10);
                tryHit(sX, sY, 15, attacker.slapDmg, 25);
            }
            if (!hit && attacker.hasAbility('BIRCH TREE')) {
                const tAngle = attacker.treeAngle;
                const tX = attacker.x + Math.cos(tAngle) * (offset + 35);
                const tY = attacker.y + Math.sin(tAngle) * (offset + 35);
                tryHit(tX, tY, 15, attacker.treeDmg, 35);
            }
        }

        function updateStatsUI() {
            if (balls.length === 0) { statsPanel.innerHTML = '<div class="text-[10px] opacity-50 lowercase p-2 w-full text-center">arena empty</div>'; return; }
            const sortedBalls = [...balls].sort((a, b) => b.hp - a.hp);
            statsPanel.innerHTML = sortedBalls.map(b => {
                const subStats = b.getStats();
                const hpPercent = Math.max(0, (b.hp / b.maxHp) * 100);
                let borderColor = (b.teamId === 'alpha') ? '#3b82f6' : (b.teamId === 'omega' ? '#ef4444' : (b.hasAbility('black hole') ? '#4f46e5' : b.color));
                if (b.isUltra) borderColor = '#db2777';
                
                const frozenClass = b.frozenTimer > 0 ? 'ring-2 ring-sky-400' : '';

                return `
                    <div class="stats-card p-2 text-[10px] rounded bg-slate-800/80 border-l-4 flex-shrink-0 relative ${frozenClass}" style="border-color: ${borderColor}">
                        ${b.frozenTimer > 0 ? '<div class="absolute top-1 right-1 text-xs">❄️</div>' : ''}
                        <div class="flex justify-between items-start gap-1">
                            <div class="font-bold lowercase truncate w-20 text-white leading-none">${b.type}${b.isClone ? '*' : ''}</div>
                            <span class="font-mono text-blue-400 bg-blue-900/30 px-1 rounded">${formatNum(b.hp)}</span>
                        </div>
                        <div class="w-full bg-slate-900 h-1 mt-1 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 transition-all duration-300" style="width: ${hpPercent}%"></div>
                        </div>
                        <div class="flex flex-col gap-0.5 mt-1.5">
                            ${subStats.map(s => `
                                <div class="flex justify-between gap-2 uppercase tracking-tighter">
                                   <span class="opacity-40 text-[9px]">${s.k}:</span>
                                   <span class="font-bold text-slate-200">${s.v}</span>
                                   ${s.k2 ? `<span class="opacity-40 text-[9px] ml-1">${s.k2}:</span><span class="font-bold text-slate-200">${s.v2}</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }

        let lastStatUpdate = 0;
        function loop(timestamp) {
            if (settings.legacy) {
                ctx.save();
                if (screenShake > 0) { ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake); screenShake *= 0.9; }
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#111827'; ctx.fillRect(0, height - STATS_HEIGHT, width, STATS_HEIGHT);
            } else {
                ctx.save();
                if (screenShake > 0) { ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake); screenShake *= 0.9; }
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#020617'); grad.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
                const gridSize = 50;
                ctx.beginPath();
                for(let x=0; x<width; x+=gridSize) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
                for(let y=0; y<height; y+=gridSize) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
                ctx.stroke();

                ctx.fillStyle = 'rgba(15, 23, 42, 0.5)'; ctx.fillRect(0, height - STATS_HEIGHT, width, STATS_HEIGHT);
            }

            for (let i = visuals.length - 1; i >= 0; i--) {
                const v = visuals[i]; v.life -= 0.05; v.r += (v.maxR - v.r) * 0.2;
                if (v.life <= 0) visuals.splice(i, 1);
                else {
                    ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, Math.PI * 2);
                    if (settings.legacy) ctx.fillStyle = v.color || `rgba(249, 115, 22, ${v.life * 0.4})`;
                    else {
                        ctx.shadowBlur = 10; ctx.shadowColor = v.color;
                        ctx.fillStyle = v.color || `rgba(249, 115, 22, ${v.life})`;
                        ctx.globalAlpha = v.life;
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
                }
            }
            for (let i = pools.length - 1; i >= 0; i--) {
                const p = pools[i]; p.life -= 0.0166;
                if (p.life <= 0) pools.splice(i, 1);
                else {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    if (p.isBurnerTrail) {
                         if (settings.legacy) ctx.fillStyle = `rgba(249, 115, 22, ${Math.min(0.3, p.life)})`;
                         else ctx.fillStyle = `rgba(255, 100, 0, ${Math.min(0.2, p.life)})`;
                    } else {
                         ctx.fillStyle = `rgba(254, 240, 138, ${Math.min(0.3, p.life)})`;
                    }
                    ctx.fill();
                }
            }
            
            // Update and draw stars
            updateStars();
            
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                
                let hit = false;
                for (let j = 0; j < balls.length; j++) {
                    const target = balls[j];
                    if (target.id === b.ownerId || (b.teamId && b.teamId === target.teamId)) continue;
                    if (Math.hypot(b.x - target.x, b.y - target.y) < target.radius + 4) {
                        const owner = balls.find(o => o.id === b.ownerId);
                        target.takeDamage(b.dmg, owner);
                        const kbA = Math.atan2(target.y - b.y, target.x - b.x);
                        target.applyKnockback(kbA, b.kb);
                        hit = true; break;
                    }
                }
                
                if (hit || b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height - STATS_HEIGHT) bullets.splice(i, 1);
                else {
                    ctx.fillStyle = '#fde047';
                    if (!settings.legacy) { ctx.shadowBlur = 5; ctx.shadowColor = '#fde047'; }
                    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); }
            }
            ctx.globalAlpha = 1;
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i]; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = l.life/2;
                if (!settings.legacy) { ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444'; }
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                ctx.shadowBlur = 0;
                l.life--; if (l.life <= 0) lasers.splice(i, 1);
            }
            checkCollisions();
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i]; b.update(); b.draw();
                if (b.hp <= 0) {
                    if (b.hasAbility('grabber') && b.grabTargetId) {
                        const victim = balls.find(v => v.id === b.grabTargetId);
                        if (victim) victim.grabbedBy = null;
                    }
                    if (b.hasAbility('splitter') && b.isSplitterOG) {
                        balls = balls.filter(other => !(other.hasAbility('splitter') && other.splitterRootId === b.id));
                    }
                    createParticles(b.x, b.y, b.color); balls.splice(i, 1);
                }
            }
            ctx.restore();
            if (timestamp - lastStatUpdate > 100) { updateStatsUI(); lastStatUpdate = timestamp; }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        spawnBall('zen');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
